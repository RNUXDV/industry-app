name: Security migration integrity

# No filters: unrelated changes must not skip this required check.
"on":
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  security-migration-pair:
    name: Security migration pair and reviewed hash
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Test publication guard failure cases
        run: python3 tests/test-security-migration-pair.py
      - name: Verify the proposed tree
        run: python3 tests/check-security-migration-pair.py HEAD
