<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Industry Backend Test</title>
  </head>

  <body>
    <h1>Industry Backend Test</h1>
    <p id="backend-status">Supabase test page loaded.</p>
    <h2>Create account</h2>

    <form id="signup-form">
      <p>
        <label>
          Full name
          <input id="signup-name" type="text" required />
        </label>
      </p>

      <p>
        <label>
          Email
          <input id="signup-email" type="email" required />
        </label>
      </p>

      <p>
        <label>
          Password
          <input id="signup-password" type="password" required />
        </label>
      </p>

      <button type="submit">Create account</button>
    </form>

    <p id="signup-status"></p>

    <h2>Sign in</h2>
    <form id="login-form">
      <p>
        <label>
          Email
          <input id="login-email" type="email" required />
        </label>
      </p>

      <p>
        <label>
          Password
          <input id="login-password" type="password" required />
        </label>
      </p>

      <button type="submit">Sign in</button>
    </form>

    <p id="login-status"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SUPABASE_URL = "https://pzgfottwuczqgisrlfss.supabase.co";

      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_I4zjPUH_5zqN0x2cV_n1iQ_-gUwPS2H";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
      );

      document.querySelector("#backend-status").textContent =
        "Supabase client initialized.";

      console.log("Supabase client initialized:", supabaseClient);
      const signupForm = document.querySelector("#signup-form");
      const signupStatus = document.querySelector("#signup-status");

      signupForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const fullName = document.querySelector("#signup-name").value.trim();

        const email = document.querySelector("#signup-email").value.trim();

        const password = document.querySelector("#signup-password").value;

        signupStatus.textContent = "Creating account...";

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
            },
          },
        });

        if (error) {
          console.error("Signup error:", error);
          signupStatus.textContent = `Account creation failed: ${error.message}`;
          return;
        }

        console.log("Signup result:", data);

        if (data.session) {
          signupStatus.textContent = `Account created for ${data.user.email}.`;
        } else {
          signupStatus.textContent = `Account created for ${data.user.email}. Check your email if confirmation is required.`;
        }
      });
      const loginForm = document.querySelector("#login-form");
      const loginStatus = document.querySelector("#login-status");

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.querySelector("#login-email").value.trim();
        const password = document.querySelector("#login-password").value;

        loginStatus.textContent = "Signing in...";

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          console.error("Sign-in error:", error);
          loginStatus.textContent = `Sign-in failed: ${error.message}`;
          return;
        }

        loginStatus.textContent = `Signed in as ${data.user.email}`;
        console.log("Signed in user:", data.user);

        const { data: profile, error: profileError } = await supabaseClient
          .from("profiles")
          .select("id, full_name, created_at")
          .maybeSingle();

        if (profileError) {
          console.error("Profile error:", profileError);
          loginStatus.textContent = `Signed in, but profile read failed: ${profileError.message}`;
          return;
        }

        if (!profile) {
          loginStatus.textContent =
            "Signed in, but no profile row was returned.";
          return;
        }

        loginStatus.textContent = `Signed in as ${data.user.email} — Profile: ${profile.full_name}`;

        console.log("Profile returned:", profile);
        const OTHER_PROFILE_ID = "5c0df709-0809-4d4d-b63d-5ce6a9699115";

        console.log("Starting RLS test query...");
        const { data: otherProfiles, error: otherProfileError } =
          await supabaseClient
            .from("profiles")
            .select("id, full_name")
            .eq("id", OTHER_PROFILE_ID);
        console.log("RLS query completed:", {
          otherProfiles,
          otherProfileError,
        });

        if (otherProfileError) {
          console.error("RLS test error:", otherProfileError);

          loginStatus.textContent = `RLS test error: ${otherProfileError.message}`;

          return;
        }

        if (otherProfiles.length > 0) {
          loginStatus.textContent =
            "RLS TEST FAILED — another user's profile was returned.";

          console.error("RLS TEST FAILED:", otherProfiles);

          return;
        }

        loginStatus.textContent = `Signed in as ${data.user.email} — Profile: ${profile.full_name} — RLS PASS: other profile blocked.`;

        console.log("RLS PASS: Test Worker Two was not accessible.");
      });
    </script>
  </body>
</html>
